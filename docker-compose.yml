version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./backend/scripts_sql:/docker-entrypoint-initdb.d/
    container_name: pg-practica-proies
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=practica_investigacion
    ports:
      - "5433:5432"
    networks:
      - proies-network

  api:
    build: .
    container_name: fast-api-nl2sql
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
    depends_on:
      - db
    networks:
      - proies-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: streamlit-proies-nl2sql
    ports:
      - "8501:8501"
    depends_on:
      - api
      - db
    networks:
      - proies-network

networks:
  proies-network:
    driver: bridge